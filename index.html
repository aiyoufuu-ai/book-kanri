<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="本棚">
  <title>本棚かんり</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📚 本棚かんり</h1>
    <span id="count" class="count"></span>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="タイトル・著者・ISBN・メモで検索" autocomplete="off">
      <div class="row">
        <select id="sort" aria-label="並び順">
          <option value="added-desc">追加が新しい順</option>
          <option value="added-asc">追加が古い順</option>
          <option value="title">タイトル順</option>
          <option value="author">著者順</option>
        </select>
        <select id="filter-location" aria-label="場所で絞り込み">
          <option value="">すべての場所</option>
        </select>
      </div>
    </section>

    <ul id="book-list" class="book-list"></ul>
    <p id="empty" class="empty" hidden>まだ本がありません。<br>下の「スキャン」からバーコードを読み取って登録しましょう。</p>
  </main>

  <nav class="bottombar">
    <button id="btn-scan" class="primary">📷 スキャン</button>
    <button id="btn-manual">⌨️ ISBN入力</button>
    <button id="btn-menu">⋯</button>
  </nav>

  <!-- スキャナ -->
  <dialog id="scanner" class="fullscreen">
    <div class="scanner-head">
      <div class="mode-toggle" role="radiogroup" aria-label="モード">
        <label><input type="radio" name="mode" value="add" checked> 登録</label>
        <label><input type="radio" name="mode" value="check"> 持ってる？チェック</label>
      </div>
      <button id="btn-close-scan" class="icon" aria-label="閉じる">✕</button>
    </div>
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <div class="guide"></div>
    </div>
    <p class="hint">本の裏の <b>978 / 979</b> で始まるバーコードを枠に合わせてください</p>
    <div id="scan-result" class="scan-result"></div>
  </dialog>

  <!-- ISBN手入力 -->
  <dialog id="manual">
    <form method="dialog" id="manual-form">
      <h2>ISBNを入力</h2>
      <input id="manual-isbn" inputmode="numeric" placeholder="978..." autocomplete="off" required>
      <div class="actions">
        <button value="cancel" formnovalidate>キャンセル</button>
        <button value="ok" class="primary">検索して追加</button>
      </div>
    </form>
  </dialog>

  <!-- 詳細・編集 -->
  <dialog id="detail">
    <form method="dialog" id="detail-form">
      <div class="detail-head">
        <img id="d-cover" alt="">
        <div>
          <input id="d-title" placeholder="タイトル" required>
          <input id="d-author" placeholder="著者">
          <input id="d-publisher" placeholder="出版社">
          <small id="d-isbn"></small>
        </div>
      </div>
      <label>場所 <input id="d-location" list="locations" placeholder="例: リビング本棚"></label>
      <datalist id="locations"></datalist>
      <label>状態
        <select id="d-status">
          <option value="unread">未読</option>
          <option value="reading">読書中</option>
          <option value="read">読了</option>
          <option value="lent">貸出中</option>
        </select>
      </label>
      <label>メモ <textarea id="d-memo" rows="3"></textarea></label>
      <div class="actions">
        <button value="delete" id="d-delete" class="danger" formnovalidate>削除</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>閉じる</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- メニュー -->
  <dialog id="menu">
    <form method="dialog">
      <h2>Googleスプレッドシート連携</h2>
      <p class="note">スプレッドシートに本の一覧を保存し、家族の複数の端末で共有できます。設定方法は README の「スプレッドシート連携」を見てください。</p>
      <label>ウェブアプリのURL <input id="sync-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>
      <label>合言葉 <input id="sync-token" autocomplete="off"></label>
      <p id="sync-status" class="note"></p>
      <div class="actions">
        <button type="button" id="btn-sync-off" class="danger">解除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-sync-now">同期</button>
        <button type="button" id="btn-sync-save" class="primary">保存</button>
      </div>
      <h2>データ</h2>
      <button type="button" id="btn-export-json">JSONで書き出し（バックアップ）</button>
      <button type="button" id="btn-export-csv">CSVで書き出し</button>
      <button type="button" id="btn-import">JSONから読み込み</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <p class="note">連携していない場合、データはこの端末のブラウザ内だけに保存されます。機種変更前などはJSONでバックアップしてください。</p>
      <div class="actions"><button value="close">閉じる</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
